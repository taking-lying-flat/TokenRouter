model:
  quick:
    # algorithms
    model_path: "nics-efc/CoLLM_Qwen3_0_6B"
    dtype: "bfloat16"
    param_num_billion: 0.6

    # system
    host: "0.0.0.0"
    port: 30000
    tp_size: 1
    base_gpu_id: 0
    disable_cuda_graph: false
    disable_radix_cache: false
    disable_overlap_schedule: true

    # router
    scheduler_class: "collm_base"
    enable_return_hidden_states: true
    force_return_hidden_states: true
    scheduler_kwargs:
      defer_threshold: 0.15
      warmup_steps: 15
      warmup_schedule: "constant"

  reference:
    # algorithms
    model_path: "Qwen/Qwen3-32B"
    dtype: "bfloat16"
    param_num_billion: 32.0

    # system
    tp_size: 2
    base_gpu_id: 0
    disable_cuda_graph: false
    cuda_graph_bs: []
    cuda_graph_bs_extend:
      16: !range [16,64]
    disable_radix_cache: true
    disable_overlap_schedule: true
    forward_mode_for_single_token: "extend"
    delayed_batching_threshold: [1,2,2,3,4,5,5,6,7,8,9,10,10,11,12,13]

    # router
    scheduler_class: "collm_assist"

system:
  entry_model: "quick"
  mem_fraction_static: 0.85
